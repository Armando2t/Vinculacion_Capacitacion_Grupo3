<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio Nivel 1 - API REST</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">

        <h1>Ejercicio Nivel 1 - Consumo de API REST</h1>

        <p>
            Este ejercicio permite consumir la API pública JSONPlaceholder
            utilizando el método HTTP GET.
        </p>

        <div class="seccion">

            <h2>Consultar una publicación</h2>

            <label for="postId">
                Número de publicación:
            </label>

            <input
                type="number"
                id="postId"
                value="1"
                min="1"
                max="100"
            >

            <button onclick="consultarPost()">
                Consultar publicación
            </button>

        </div>


        <div class="seccion">

            <h2>Consultar usuarios</h2>

            <button onclick="consultarUsuarios()">
                Ver lista de usuarios
            </button>

        </div>


        <div class="resultado">

            <h2>Resultado</h2>

            <pre id="resultado">
Realiza una consulta para visualizar la respuesta de la API.
            </pre>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
